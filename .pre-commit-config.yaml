repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      # Checks the whole project, not just the staged files: a change to one module can
      # break the types of another.
      - id: tsc
        name: tsc (checkJs)
        entry: npm exec --no -- tsc --project tsconfig.json
        language: system
        files: (\.js|\.d\.ts|^tsconfig\.json|^package(-lock)?\.json)$
        pass_filenames: false
        require_serial: true
