[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mendwork"
version = "0.1.0"
description = "Self-healing browser automation: record once, replay free, repair cheaply, verify every repair."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.62",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.10",
    "structlog>=24.4",
    "typer>=0.12",
]

[project.scripts]
mendwork = "mendwork.apps.cli.main:app"

[dependency-groups]
dev = [
    "hypothesis>=6.115",
    "import-linter>=2.1",
    "jsonschema>=4.26.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.23.1",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mendwork"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks"]
# ruff formats Python code blocks inside Markdown. The design documents use
# illustrative snippets that are not meant to compile or to be reflowed.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "ANN",   # flake8-annotations: everything is typed
    "ASYNC", # flake8-async: no blocking calls in async code
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except: no bare/broad except
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez: no naive datetimes
    "E",     # pycodestyle errors
    "ERA",   # eradicate: no commented-out code
    "F",     # pyflakes
    "FIX",   # flake8-fixme: no TODO/FIXME in committed code
    "I",     # isort
    "N",     # pep8-naming
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "T20",   # flake8-print: no print(), logging only
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# The error names are fixed by ARCHITECTURE.md section 5, which favours reading
# at the raise site ("raise AmbiguousTarget") over the N818 "...Error" suffix.
"src/mendwork/engine/errors.py" = ["N818"]
# Assertions are the point of a test, and the fake credentials in the redaction
# tests are the subject under test rather than a leaked secret.
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["mendwork", "benchmarks", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "benchmarks"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "browser: drives headless Chromium against the locally served chaos portal",
    "slow: CLI browser runs, pair sweeps, portal replays, the heal fixture suite, recordings, and portal determinism; excluded from make check, run by make check-all and CI",
    "live: calls the configured model provider for real; deselected unless --live-providers (make live-providers), never run in CI",
]
filterwarnings = ["error"]
xfail_strict = true
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/mendwork"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
