<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sign in · Leakage fixture</title>
  </head>
  <body>
    <main>
      <h1>Sign in to the leakage fixture</h1>
      <!--
        No scripts, deliberately. The password field has no name, so the form never sends
        it: a secret typed here can only reach Mendwork's artifacts through Mendwork itself.
      -->
      <form action="app.html" method="get">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" data-testid="email">
        <label for="password">Password</label>
        <input id="password" type="password" data-testid="password">
        <button id="sign-in" type="submit" data-testid="sign-in">Sign in</button>
      </form>
    </main>
  </body>
</html>
