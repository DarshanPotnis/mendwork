# yaml-language-server: $schema=../../schemas/workflow.schema.json
# Open the detail view of purchase order PO-1042 in the Harborline supplier portal (chaos
# portal). Every order row has an identical "View" button, so the scoped selector finds
# the one inside the PO-1042 row.
schema_version: 1
workflow_id: view_order_detail
version: 1
created_at: "2026-09-11T00:00:00Z"

inputs:
  - name: portal_url
    kind: url
    description: Sign-in page of the portal, e.g. http://127.0.0.1:8765/index.html
  - name: account_email
    kind: text
    description: Email address of the portal account

secrets:
  - portal_password

steps:
  - id: open_sign_in
    intent: Open the supplier portal sign-in page
    action: navigate
    risk: safe
    value: {kind: input, name: portal_url}
    checkpoints:
      - kind: element_visible
        selector: {strategy: role_name, role: heading, name: Sign in to the supplier portal}

  - id: fill_email
    intent: Fill the 'Email address' field
    action: fill
    risk: caution
    target:
      tag: input
      role: textbox
      accessible_name: Email address
      label_text: Email address
      attributes: {id: email, name: email, type: email, autocomplete: username, data_testid: login-email}
      nearby_text: [Sign in to the supplier portal]
      structural_path: main > section > form > div > div > input
      bbox: {x: 0.3555, y: 0.3903, width: 0.2891, height: 0.0563}
      selectors:
        - {strategy: test_id, value: login-email}
        - {strategy: role_name, role: textbox, name: Email address}
        - {strategy: label, value: Email address}
        - {strategy: css, value: "#email"}
    value: {kind: input, name: account_email}
    checkpoints:
      - kind: no_error_banner

  - id: fill_password
    intent: Fill the 'Password' field
    action: fill
    risk: caution
    target:
      tag: input
      accessible_name: Password          # ARIA defines no role for password inputs
      label_text: Password
      attributes: {id: password, name: password, type: password, autocomplete: current-password, data_testid: login-password}
      nearby_text: [Sign in to the supplier portal]
      structural_path: main > section > form > div > div > input
      bbox: {x: 0.3555, y: 0.5062, width: 0.2891, height: 0.0563}
      selectors:
        - {strategy: test_id, value: login-password}
        - {strategy: label, value: Password}
        - {strategy: css, value: "#password"}
    value: {kind: secret, name: portal_password}
    checkpoints:
      - kind: no_error_banner

  - id: sign_in
    intent: Click the 'Sign in' button
    action: click
    risk: caution                        # changes session state, reversibly (sign out undoes it)
    target:
      tag: button
      role: button
      accessible_name: Sign in
      text: Sign in
      attributes: {id: sign-in, type: submit, data_testid: login-submit}
      nearby_text: [Sign in to the supplier portal]
      structural_path: main > section > form > div > button
      bbox: {x: 0.3555, y: 0.5958, width: 0.2891, height: 0.0528}
      selectors:
        - {strategy: test_id, value: login-submit}
        - {strategy: role_name, role: button, name: Sign in}
        - {strategy: text, value: Sign in}
        - {strategy: css, value: "#sign-in"}
    checkpoints:
      - kind: url_matches
        mode: regex
        pattern: 'https?://[^?#]+/dashboard\.html(?:[?#].*)?'
      - kind: no_error_banner            # "Incorrect email or password." is role=alert

  - id: open_orders
    intent: Click the 'Orders' link in the primary navigation
    action: click
    risk: safe
    target:
      tag: a
      role: link
      accessible_name: Orders
      text: Orders
      attributes: {id: nav-orders, href: /orders.html, data_testid: nav-orders}
      structural_path: header > div > nav > ul > li > a
      bbox: {x: 0.369, y: 0.0177, width: 0.0563, height: 0.0535}
      selectors:
        - {strategy: test_id, value: nav-orders}
        - strategy: role_name
          role: link
          name: Orders
          within: {strategy: role_name, role: navigation, name: Primary}
        - {strategy: css, value: "#nav-orders"}
    checkpoints:
      - kind: url_matches
        mode: regex
        pattern: 'https?://[^?#]+/orders\.html(?:[?#].*)?'

  - id: view_po_1042
    intent: Click the 'View' button in the PO-1042 row
    action: click
    risk: safe                           # opens a detail view; reads only
    target:
      tag: button
      role: button
      accessible_name: View order PO-1042
      text: View order PO-1042
      attributes: {id: view-po-1042, type: button}
      nearby_text: [Recent orders, PO-1042, Actions]
      structural_path: main > section > table > tbody > tr > td > button
      bbox: {x: 0.8673, y: 0.5412, width: 0.0413, height: 0.0277}
      selectors:
        - {strategy: role_name, role: button, name: View order PO-1042}
        - strategy: role_name
          role: button
          name: View
          exact: false
          within: {strategy: role_name, role: row, name: PO-1042, exact: false}
        - {strategy: css, value: "#view-po-1042"}
    checkpoints:
      - kind: element_visible
        selector: {strategy: role_name, role: heading, name: Order PO-1042}
